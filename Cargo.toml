[package]
name = "ccs"
version = "0.1.0"
edition = "2024"
description = "Claude Code and Codex account switcher with subscription usage tracking"
license = "MIT"
repository = "https://github.com/orthory/ccs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

# The app beside the binary: one workspace, one lock file, one `target/`.
[workspace]
members = ["app"]

# ducktape-ui patches two iced crates in its own workspace, and a dependant
# does not inherit a patch: without these the app would run the runtime
# against crates it was never tested with. Same revision as the app pins.
[patch.crates-io]
iced_tiny_skia = { git = "https://github.com/byeongsu-hong/ducktape-ui", rev = "39377ff1b6553cbbe34bec21e949c7912013978e" }
iced_winit = { git = "https://github.com/byeongsu-hong/ducktape-ui", rev = "39377ff1b6553cbbe34bec21e949c7912013978e" }

[profile.release]
opt-level = "z"
lto = true
strip = true
